name: Build Mudgugu AR tracking target

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mudgugu-target.yml'
      - 'docs/mudgugu-target.jpg'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Compile target through MindAR in Chromium
        run: node scripts/compile-mudgugu.mjs
      - name: Commit precompiled MindAR target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/targets.mind
          if git diff --cached --quiet; then
            echo "Target already up-to-date"
          else
            git commit -m "Precompile Mudgugu image target for mobile AR"
            git push
          fi
