<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151416">
  <title>泥咕咕 · 破画而出</title>
  <link rel="icon" href="./mudgugu-target.jpg" type="image/jpeg">
  <link rel="stylesheet" href="./mudgugu.css?v=3d1">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
  </script>
</head>
<body>
  <div id="ar" aria-hidden="true"></div>
  <main id="intro">
    <div class="panel">
      <div class="poster"><img src="./mudgugu-target.jpg" width="260" height="256" alt="扫描目标。浅蓝海报上的黑色泥咕咕"></div>
      <div class="intro-copy">
        <p class="origin">河南浚县 · 泥塑</p>
        <h1>泥咕咕<br>破画而出</h1>
        <p class="instructions">打开摄像头，把海报上的整只泥咕咕放进画面，看它扇动翅膀飞出来。</p>
        <div class="actions">
          <button id="start" type="button">开启 AR 摄像头</button>
          <button id="preview-button" class="secondary" type="button">预览 3D 模型</button>
        </div>
        <p id="status" role="status"></p>
        <label class="file-label">更换识别图片（可选）<input id="photo" type="file" accept="image/*"></label>
      </div>
    </div>
  </main>
  <section id="preview" hidden aria-label="泥咕咕 3D 预览">
    <div id="model-stage" aria-hidden="true"></div>
    <header class="preview-header"><h2>泥咕咕</h2><button id="close-preview" class="secondary" type="button">返回</button></header>
    <p id="preview-status" role="status">拖动查看模型的各个角度</p>
  </section>
  <div id="hud" hidden>
    <span id="hint" role="status">正在寻找泥咕咕海报…</span>
    <button id="replay" type="button" disabled>再次飞出</button>
    <button id="stop" class="secondary" type="button">退出</button>
  </div>
  <script type="module" src="./webar.js?v=3d1"></script>
</body>
</html>
